name: Validate plugins
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-agent-plugins.txt
      - run: python scripts/maintain-upstreams.py --validate
      - run: python scripts/test-maintain-upstreams.py
      - run: python scripts/build-ghast-catalog.py
      - run: git diff --exit-code -- plugin-catalog.json packages
      - run: python scripts/validate-ghast-repository.py
      - name: Isolated hook execution (no write token or account secrets)
        run: node scripts/smoke-ponytail-package.mjs
